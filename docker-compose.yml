version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: weintern_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: weintern_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=weintern_attendance
      - JWT_SECRET_KEY=weintern_super_secret_jwt_key_change_in_production_2026
    depends_on:
      - mongodb

volumes:
  mongo_data:
